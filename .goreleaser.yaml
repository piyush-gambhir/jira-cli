version: 2

project_name: jira-cli

# Optional built-in OAuth app, injected at release time from CI secrets so users
# of the released binaries can `jira auth login --type oauth2` with no app
# registration. Default to empty (templates below resolve cleanly) so local
# `--snapshot` builds and forks ship WITHOUT embedded credentials.
env:
  - JIRA_OAUTH_CLIENT_ID={{ if index .Env "JIRA_OAUTH_CLIENT_ID" }}{{ .Env.JIRA_OAUTH_CLIENT_ID }}{{ end }}
  - JIRA_OAUTH_CLIENT_SECRET={{ if index .Env "JIRA_OAUTH_CLIENT_SECRET" }}{{ .Env.JIRA_OAUTH_CLIENT_SECRET }}{{ end }}

builds:
  - binary: jira
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s
      - -w
      - -X github.com/piyush-gambhir/jira-cli/internal/version.Version={{.Version}}
      - -X github.com/piyush-gambhir/jira-cli/internal/version.Commit={{.Commit}}
      - -X github.com/piyush-gambhir/jira-cli/internal/version.BuildTime={{.Date}}
      - -X github.com/piyush-gambhir/jira-cli/internal/auth.EmbeddedClientID={{.Env.JIRA_OAUTH_CLIENT_ID}}
      - -X github.com/piyush-gambhir/jira-cli/internal/auth.EmbeddedClientSecret={{.Env.JIRA_OAUTH_CLIENT_SECRET}}

archives:
  - format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
      - Merge pull request
      - Merge branch
