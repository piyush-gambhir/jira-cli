version: 2

project_name: jira-cli

builds:
  - binary: jira
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s
      - -w
      - -X github.com/piyush-gambhir/jira-cli/internal/version.Version={{.Version}}
      - -X github.com/piyush-gambhir/jira-cli/internal/version.Commit={{.Commit}}
      - -X github.com/piyush-gambhir/jira-cli/internal/version.BuildTime={{.Date}}

sboms:
  - artifacts: archive
    disable: false

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
      - Merge pull request
      - Merge branch
